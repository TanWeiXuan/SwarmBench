name: Submission Reporter

on:
  workflow_run:
    workflows: ["Submission Validation"]
    types: [requested, in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] }}
    runs-on: ubuntu-latest
    steps:
      - name: Download final validated result
        if: ${{ github.event.workflow_run.status == 'completed' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: calibration-result
          path: reporter-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Update sticky progress and enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prNumber = run.pull_requests[0].number;
            const {data: files} = await github.rest.pulls.listFiles({...context.repo, pull_number: prNumber, per_page: 100});
            if (!files.some(file => file.filename.startsWith('submissions/'))) return;
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100
            });
            const mark = (prefix) => {
              const matches = jobs.jobs.filter(job => job.name.startsWith(prefix));
              if (!matches.length) return '⏳';
              if (matches.every(job => job.conclusion === 'success')) return '✅';
              if (matches.some(job => job.conclusion && job.conclusion !== 'success')) return '❌';
              return '🔄';
            };
            let body = '<!-- swarmbench-submission-progress -->\n🐝 **SwarmBench Submission Validation**\n\n';
            body += `${mark('Submission structure')} Submission structure\n`;
            body += `${mark('Controller import and API')} Controller import/API\n`;
            body += `${mark('Empty-arena smoke and timing')} Empty-arena smoke test\n`;
            const calibration = jobs.jobs.filter(job => job.name.startsWith('Calibration seed'));
            const done = calibration.filter(job => job.conclusion === 'success').length;
            body += `${mark('Calibration seed')} Calibration tournament — ${done} / 4 seed batches\n`;
            body += `${mark('Submission Gate')} Initial Glicko-2 and Submission Gate\n`;
            if (run.status === 'completed' && run.conclusion === 'success') {
              const fs = require('fs');
              const path = 'reporter-artifact/calibration-result.json';
              if (fs.existsSync(path)) {
                const result = JSON.parse(fs.readFileSync(path, 'utf8'));
                const valid = result.schema === 'swarmbench-calibration-v1'
                  && Number.isInteger(result.match_count)
                  && result.match_count === result.wins + result.draws + result.losses
                  && Number.isFinite(result.provisional_rating)
                  && Number.isFinite(result.deviation)
                  && result.timing && Number.isFinite(result.timing.mean);
                if (valid) {
                  body += `\n**Validation complete**\n\n`;
                  body += `Calibration: ${result.wins} W / ${result.draws} D / ${result.losses} L (${result.match_count} games)\n`;
                  body += `Initial Glicko-2: ${result.provisional_rating.toFixed(0)} (RD ${result.deviation.toFixed(0)})\n`;
                  body += `Mean / P95 / max step: ${(result.timing.mean*1000).toFixed(2)} / ${(result.timing.p95*1000).toFixed(2)} / ${(result.timing.max*1000).toFixed(2)} ms\n`;
                }
              }
            }
            let mergeNote = '⏳ Auto-merge';
            if (run.status === 'completed' && run.conclusion === 'success') {
              try {
                const {data: pull} = await github.rest.pulls.get({...context.repo, pull_number: prNumber});
                await github.graphql(`mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { clientMutationId } }`, {id: pull.node_id});
                mergeNote = '✅ Auto-merge enabled';
              } catch (error) {
                mergeNote = `⚠️ Validation passed; auto-merge could not be enabled (${error.message})`;
              }
            } else if (run.status === 'completed') {
              mergeNote = '❌ Auto-merge blocked by validation';
            }
            body += `${mergeNote}\n\n[Validation run](${run.html_url})`;
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: prNumber, per_page: 100});
            const existing = comments.find(comment => comment.body?.includes('<!-- swarmbench-submission-progress -->'));
            if (existing) {
              await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: prNumber, body});
            }
